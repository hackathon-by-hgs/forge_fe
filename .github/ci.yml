name: CI/CD — Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ─────────────────────────────────────────────
# JOB 1 — Quality Gates (runs on every PR & push)
# ─────────────────────────────────────────────
jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check          # add "type-check": "tsc --noEmit" to package.json

      - name: Run tests
        run: npm test -- --passWithNoTests --coverage
        env:
          CI: true

# ─────────────────────────────────────────────
# JOB 2 — Build (runs on every PR & push)
# ─────────────────────────────────────────────
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Restore the Next.js build cache between runs
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build application
        run: npm run build
        env:
          # Inject all production env vars from GitHub Secrets
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # Add more NEXT_PUBLIC_* vars here as needed

      # Upload the build artifact so the deploy job can use it
      # without re-building
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.*
          retention-days: 1

# ─────────────────────────────────────────────
# JOB 3 — Deploy (only on push to main)
# ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}

      # ── Package everything for transfer ──────────────────────
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            .next/ \
            public/ \
            package.json \
            package-lock.json \
            next.config.*

      # ── Copy archive to VPS ──────────────────────────────────
      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          source:   deploy.tar.gz
          target:   /tmp/

      # ── Run remote deployment script ─────────────────────────
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="/var/www/your-app"          # ← change to your app directory
            RELEASE_DIR="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
            SHARED_DIR="$APP_DIR/shared"
            CURRENT_LINK="$APP_DIR/current"

            echo "▶ Creating release directory: $RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$SHARED_DIR/node_modules"

            echo "▶ Extracting archive..."
            tar -xzf /tmp/deploy.tar.gz -C "$RELEASE_DIR"
            rm /tmp/deploy.tar.gz

            echo "▶ Linking shared node_modules..."
            ln -sfn "$SHARED_DIR/node_modules" "$RELEASE_DIR/node_modules"

            echo "▶ Installing production dependencies..."
            cd "$RELEASE_DIR"
            npm ci --omit=dev --prefer-offline

            echo "▶ Linking shared .env..."
            # .env.production lives in $SHARED_DIR — never stored in git
            ln -sfn "$SHARED_DIR/.env.production" "$RELEASE_DIR/.env.production"

            echo "▶ Switching current release (atomic symlink swap)..."
            ln -sfn "$RELEASE_DIR" "$APP_DIR/next"
            mv -Tf "$APP_DIR/next" "$CURRENT_LINK"

            echo "▶ Restarting app with PM2..."
            cd "$CURRENT_LINK"
            pm2 reload ecosystem.config.js --env production || \
            pm2 start  ecosystem.config.js --env production

            echo "▶ Saving PM2 process list..."
            pm2 save

            echo "▶ Cleaning up old releases (keep last 5)..."
            ls -dt "$APP_DIR/releases"/*/ | tail -n +6 | xargs rm -rf

            echo "✅ Deployment complete!"

      - name: Notify on success
        if: success()
        run: |
          echo "::notice title=Deployed::Production deployment succeeded for ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deploy Failed::Deployment failed for ${{ github.sha }}. Check logs above."